name: Windows wheel

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install CPU PyTorch and build tools
        run: |
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install setuptools wheel
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - name: Install and import the built wheel
        run: |
          $wheel = Get-Item dist/*.whl
          python -m pip install --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -c "from pathlib import Path; import torch, torch_iris; assert torch.__version__ == '2.12.1+cpu'; assert torch.device('iris:0').type == 'iris'; assert Path(torch_iris._C.__file__).parent == Path(torch_iris.__file__).parent; print(torch_iris.__version__, torch_iris.__file__, torch_iris._C.__file__); print('Iris Xe available:', torch_iris.is_available())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel.FullName).Hash.ToLowerInvariant()
          "$hash  $($wheel.Name)" | Set-Content -Encoding ascii -LiteralPath "$($wheel.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-wheel
          path: |
            dist/*.whl
            dist/*.sha256
          if-no-files-found: error
